<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana - Mario Physics Engine</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: monospace;
            text-align: center;
            padding-top: 50px;
        }
        canvas {
            background-color: #333;
            border: 2px solid #555;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
        }
        #console {
            margin-top: 20px;
            background: #000;
            color: #0f0;
            padding: 10px;
            display: inline-block;
            width: 600px;
            height: 100px;
            overflow-y: auto;
            text-align: left;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <h1>Banana - Mario Engine (Browser Edition)</h1>
    <p>Connect your PS5 controller and press buttons/move the stick!</p>
    
    <canvas id="gameCanvas" width="600" height="300"></canvas>
    <br>
    <div id="console">Initializing engine...<br></div>

    <script>
        // --- N64 BUTTON BITMASKS ---
        const A_BUTTON = 1 << 15; // Jump (PS5 Cross)
        const B_BUTTON = 1 << 14; // Punch (PS5 Square)
        const Z_TRIG   = 1 << 13; // Crouch (PS5 L2)

        let gPad = { stick_x: 0, stick_y: 0, button: 0 };
        let gMario = { 
            pos: [50.0, 0.0, 0.0], 
            forwardVel: 0.0, 
            yVel: 0.0, 
            isGrounded: true 
        };

        let frameCount = 0;
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const consoleDiv = document.getElementById("console");

        function logToConsole(text) {
            consoleDiv.innerHTML += text + "<br>";
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        // --- 1. CONTROLLER INPUT SYSTEM (Browser Gamepad API) ---
        function read_ps5_input() {
            const gamepads = navigator.getGamepads();
            let gp = null;
            for (let i = 0; i < gamepads.length; i++) {
                if (gamepads[i]) {
                    gp = gamepads[i];
                    break;
                }
            }

            gPad.button = 0;
            if (!gp) return;

            // Read Left Analog Stick (-1 to 1) mapped to N64 range (-80 to 80)
            let rawX = gp.axes[0] || 0;
            let rawY = gp.axes[1] || 0;
            gPad.stick_x = Math.round(rawX * 80);
            gPad.stick_y = Math.round(-rawY * 80);

            // Read Buttons (Standard Gamepad Mapping: 0 = Cross/A, 2 = Square/X, 6 = L2 Trigger)
            if (gp.buttons[0] && gp.buttons[0].pressed) gPad.button |= A_BUTTON;
            if (gp.buttons[2] && gp.buttons[2].pressed) gPad.button |= B_BUTTON;
            if (gp.buttons[6] && gp.buttons[6].value > 0.2) gPad.button |= Z_TRIG;
        }

        // --- 2. MARIO PHYSICS ENGINE ---
        function update_mario_physics(m, pad) {
            let stickMag = Math.sqrt(pad.stick_x * pad.stick_x + pad.stick_y * pad.stick_y);

            if (stickMag > 8.0) {
                let targetSpeed = stickMag > 32.0 ? 32.0 : stickMag;
                if (m.forwardVel < targetSpeed) {
                    m.forwardVel += 1.5;
                }
            } else {
                if (m.forwardVel > 0.0) {
                    m.forwardVel -= 1.0;
                    if (m.forwardVel < 0.0) m.forwardVel = 0.0;
                }
            }

            if ((pad.button & A_BUTTON) && m.isGrounded) {
                m.yVel = 22.0; // Adjusted for smooth screen scaling
                m.isGrounded = false;
            }

            if (!m.isGrounded) {
                m.pos[1] += m.yVel;
                m.yVel -= 2.5; // Gravity

                if (m.pos[1] <= 0.0) {
                    m.pos[1] = 0.0;
                    m.yVel = 0.0;
                    m.isGrounded = true;
                }
            }

            m.pos[0] += m.forwardVel * 0.2;
            if (m.pos[0] > canvas.width - 30) m.pos[0] = 50; // Loop screen edge
        }

        // --- 3. MAIN GAME LOOP ---
        function gameLoop() {
            read_ps5_input();
            update_mario_physics(gMario, gPad);

            // Clear Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Floor
            ctx.fillStyle = "#555";
            ctx.fillRect(0, canvas.height - 40, canvas.width, 40);

            // Draw Mario (Red Box)
            ctx.fillStyle = "#ff0000";
            let renderX = gMario.pos[0];
            let renderY = (canvas.height - 40) - 30 - gMario.pos[1];
            ctx.fillRect(renderX, renderY, 30, 30);

            // Log status every 30 frames (~1 second)
            if (frameCount % 30 === 0) {
                let actions = "";
                if (gPad.button & A_BUTTON) actions += "[JUMP] ";
                if (gPad.button & B_BUTTON) actions += "[PUNCH] ";
                if (gPad.button & Z_TRIG)   actions += "[CROUCH] ";
                
                logToConsole(`Frame ${String(frameCount).padStart(2, '0')} | Stick X: ${String(gPad.stick_x).padStart(3)} | Speed: ${gMario.forwardVel.toFixed(1)} | Actions: ${actions}`);
            }

            frameCount++;
            requestAnimationFrame(gameLoop);
        }

        // Start loop once user interacts with page (browser requirement for gamepads)
        window.addEventListener("click", () => {
            logToConsole("--- Engine Running! Move Stick or Press Cross (X) ---");
        }, { once: true });

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
